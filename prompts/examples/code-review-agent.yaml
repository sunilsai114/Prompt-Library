id: code-review-agent
title: Code Review Agent
description: Reviews a code diff for correctness bugs and simplification opportunities.
category: agent-recipe

type: graph_node
graph:
  position: reviewer
  upstream: [diff-fetcher]
  downstream: [summarizer]

model:
  recommended: claude-sonnet-5
  min_context: 50000

variables:
- name: diff
  type: string
  required: true
  description: The unified diff to review

output_format:
  type: json
  schema:
    findings: array

prompt: |
  You are a senior code reviewer. Review the following diff for correctness bugs
  only — not style, not naming, not hypothetical edge cases that can't actually
  occur given the surrounding code.

  For each real bug you find, report:
  - file and line
  - the concrete failure scenario (inputs/state that trigger it)
  - a one-sentence fix

  If there are no real bugs, return an empty findings list rather than inventing
  something to say.

  Diff:
  {{diff}}

  Respond as JSON: {"findings": [{"file": "...", "line": 0, "issue": "...", "fix": "..."}]}

test_cases:
- name: catches an off-by-one loop bound
  inputs:
    diff: |
      --- a/list_utils.py
      +++ b/list_utils.py
      @@ -1,3 +1,3 @@
       def last_n(items, n):
      -    return items[len(items) - n:]
      +    return items[len(items) - n + 1:]
  expected_contains: ["off-by-one", "excludes"]
- name: does not flag correct code
  inputs:
    diff: |
      --- a/math_utils.py
      +++ b/math_utils.py
      @@ -1,2 +1,2 @@
       def add(a, b):
      -    return a + b + 1
      +    return a + b
  expected_contains: []

eval:
  last_run: '2026-09-24T04:15:20Z'
  score: 4.5
  notes: "catches an off-by-one loop bound:  | does not flag correct code: score: 5\nnotes"
